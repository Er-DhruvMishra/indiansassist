# Phase C contract §11.3. The build machine now has Visual Studio 2022 Build Tools
# (MSVC 14.44 + Windows SDK), so the workspace builds on the msvc host like the CI
# release targets. The pure-Rust default features of the library crates still compile
# on stable-x86_64-pc-windows-gnu (`cargo +stable-x86_64-pc-windows-gnu test -p ia-core`).
[toolchain]
channel = "stable-x86_64-pc-windows-msvc"
components = ["rustfmt", "clippy"]
