[workspace]
resolver = "2"
members = [
    "crates/ia-core",
    "crates/ia-platform",
    "crates/ia-input-win",
    "crates/ia-capture-win",
    "crates/ia-ui",
    "crates/ia-agent",
]

# Phase C contract §11.3: MSRV Rust 1.99; dev target x86_64-pc-windows-gnu.
# The default build (no features) is pure-Rust and builds on the gnu toolchain
# without a C compiler / nasm. Every C/native-media dependency (webrtc-rs, libvpx,
# libopus, rustls, cpal) lives behind the off-by-default `media`/`gui` features that
# CI enables on the x86_64/aarch64-pc-windows-msvc release targets. See agent/README.md.
[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.99"
license = "SEE docs/LICENSE-REGISTER.md"
publish = false

[workspace.dependencies]
# Pure-Rust, no C toolchain required (build green on x86_64-pc-windows-gnu here).
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.8"
hmac = "0.12.1"
zeroize = { version = "1.8.1", features = ["derive"] }
subtle = "2.6.1"
base64 = "0.22.1"
hex = "0.4.3"
rand = "0.8.5"
rand_core = "0.6.4"
uuid = { version = "1.10.0", features = ["v4"] }
regex = "1.10.6"
url = "2.5.2"
thiserror = "1.0.64"
crossbeam-channel = "0.5.13"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Windows FFI bindings: pure Rust, builds on the gnu toolchain.
windows = "0.58.0"
windows-sys = "0.59.0"

# Pure-Rust media helpers (no C): used by capture.
yuvutils-rs = "0.5.5"
fast_image_resize = "4.2.1"
image = { version = "0.25.2", default-features = false, features = ["png", "jpeg"] }

# Async runtime + WS client. tokio and tokio-tungstenite (no TLS backend) are pure Rust.
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.24.0", default-features = false, features = ["connect"] }
futures-util = "0.3.30"

# Internal crates
ia-core = { path = "crates/ia-core" }
ia-platform = { path = "crates/ia-platform" }
ia-input-win = { path = "crates/ia-input-win" }
ia-capture-win = { path = "crates/ia-capture-win" }
ia-ui = { path = "crates/ia-ui" }

[profile.release]
strip = true
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = "s"
