[workspace]
resolver = "2"
members = [
    "crates/ia-core",
    "crates/ia-platform",
    "crates/ia-session0",
    "crates/ia-waker",
    "crates/ia-vault",
    "crates/ia-service",
    "crates/ia-watchdog",
    "crates/ia-desktop",
    "crates/ia-input-win",
    "crates/ia-capture-win",
    "crates/ia-ui",
    "crates/ia-agent",
]

# Phase C contract §11.3: MSRV Rust 1.99; build host x86_64-pc-windows-msvc.
# The full `ia-agent` binary (features `media` + `winapi` + `gui`, default on this
# MSVC host) links webrtc-rs, a prebuilt libvpx, libopus, rustls, cpal and egui.
# The library crates still compile pure-Rust with no features on the gnu toolchain
# (ia-core cross-check), but the binary needs MSVC. See agent/README.md.
[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.99"
license = "SEE docs/LICENSE-REGISTER.md"
publish = false

[workspace.dependencies]
# Pure-Rust, no C toolchain required (build green on x86_64-pc-windows-gnu here).
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.8"
hmac = "0.12.1"
zeroize = { version = "1.8.1", features = ["derive"] }
subtle = "2.6.1"
base64 = "0.22.1"
hex = "0.4.3"
rand = "0.8.5"
rand_core = "0.6.4"
uuid = { version = "1.10.0", features = ["v4"] }
# Phase D §6.1 `allowedHours`: the policy is evaluated on the device in its own IANA zone, so
# the tz database travels with the service (pure Rust, no C, no network).
#
# **No `clock` feature here.** `ia-core` takes `now` as an argument everywhere (that is what
# makes the decision table testable against fixed instants), and `clock` binds chrono to the
# Windows time API through an import library, which needs `dlltool` on the gnu toolchain — and
# so would break the `ia-core` gnu cross-check. `ia-service`, which does need the wall clock,
# turns `clock` on for itself.
chrono = { version = "0.4.38", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10.0", default-features = false, features = ["std"] }
regex = "1.10.6"
url = "2.5.2"
thiserror = "1.0.64"
crossbeam-channel = "0.5.13"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Windows FFI bindings: pure Rust, builds on the gnu toolchain.
windows = "0.58.0"
windows-sys = "0.59.0"

# Pure-Rust media helpers (no C): used by capture.
yuvutils-rs = "0.5.5"
fast_image_resize = "4.2.1"
image = { version = "0.25.2", default-features = false, features = ["png", "jpeg"] }

# Async runtime + WS client. tokio-tungstenite uses the rustls + webpki-roots TLS
# backend (§11.2; no native-tls / schannel). `wss:` is reached through rustls.
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.24.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3.30"
bytes = "1.7.1"
async-trait = "0.1.81"

# Media stack (feature `media`, MSVC only). webrtc-rs 0.17.1 is the last release with
# the classic Pion-shaped API (MediaEngine / interceptor / TrackLocalStaticSample);
# its sibling crates are pinned to the matching patch in Cargo.lock. libvpx is a
# prebuilt static library fetched by `shiguredo_libvpx` (no nasm / make). libopus is
# built from source by `audiopus_sys` via the `cc` crate. See agent/README.md §11.2.
webrtc = "=0.17.1"
shiguredo_libvpx = "=2026.2.0-canary.3"
audiopus = "0.2.0"
cpal = "0.15.3"

# Internal crates
ia-core = { path = "crates/ia-core" }
ia-platform = { path = "crates/ia-platform" }
ia-session0 = { path = "crates/ia-session0" }
ia-waker = { path = "crates/ia-waker" }
ia-vault = { path = "crates/ia-vault" }
ia-service = { path = "crates/ia-service" }
ia-watchdog = { path = "crates/ia-watchdog" }
ia-agent = { path = "crates/ia-agent", default-features = false }
ia-input-win = { path = "crates/ia-input-win" }
ia-capture-win = { path = "crates/ia-capture-win" }
ia-ui = { path = "crates/ia-ui" }

# The ladder downscale and the BGRA->I420 converter are per-pixel loops: optimise them in dev /
# test builds too, so the pump (and its loopback tests) run near real time without `--release`.
[profile.dev.package.ia-capture-win]
opt-level = 3

[profile.release]
strip = true
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = "s"
