[package]
name = "ia-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The IndiansAssist agent binary (Windows; Linux X11 since Phase E §7): token-source precedence, elevation hand-over flow, self-delete decision (pure, tested), and the webrtc-rs peer / encoders / signaling wiring behind the `media` feature (contract §11.1)."

[[bin]]
name = "IndiansAssist"
path = "src/main.rs"

[lib]
name = "ia_agent"
path = "src/lib.rs"

[features]
# Default on the Windows MSVC host is the full runnable agent. The library crates still build
# pure-Rust with `--no-default-features` on the gnu toolchain for the ia-core cross-check. The
# Linux build (Phase E §7.2, §15.6) is `--no-default-features --features
# ia-agent/media,ia-agent/x11,ia-agent/gui,ia-agent/linux-os` (no `voice`, so no ALSA).
default = ["media", "voice", "winapi", "gui"]
# `dev` compiles the local-testing switches (`--api-origin`, `--signal-url`,
# `--auto-consent`, `IA_CODEC_PREF`); a release build omits them (§2.1, §4.2).
dev = ["ia-ui/dev"]
# The webrtc-rs peer, VP8/VP9 (libvpx) encoders, rustls signaling client.
media = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:webrtc",
    "dep:bytes",
    "dep:async-trait",
    "dep:shiguredo_libvpx",
]
# Phase E §7.2: voice (cpal + Opus, C §6.3) split out of `media`, on by default on Windows and off
# on Linux, so the Linux build needs neither ALSA nor libopus.
voice = ["media", "dep:audiopus", "dep:cpal"]
# The Win32 syscall layer (DXGI/GDI capture, SendInput, registry, known folders).
winapi = [
    "ia-input-win/winapi",
    "ia-capture-win/winapi",
    "ia-platform/winapi",
    "ia-session0/winapi",
]
# Phase E §7.2: X11 capture (RandR, MIT-SHM, XFixes) and XTEST input + clipboard. Compiles to
# nothing off Linux.
x11 = ["ia-capture-x11/x11", "ia-input-x11/x11"]
# Phase E §7.7: the Linux platform impls (self-delete, deep link, single instance, folders).
linux-os = ["ia-platform/linux-os"]
# The egui/eframe consent window, pill, panel and tray icon.
gui = ["ia-ui/gui"]
# apple-owned: begin
# Phase F §17.2 / §17.7: the macOS agent (ScreenCaptureKit capture, CGEvent input). The macOS
# build is `--no-default-features --features ia-agent/media,ia-agent/macos,ia-agent/gui,ia-agent/dev`
# (§17.6). Compiles to nothing off macOS.
macos = ["ia-capture-mac/macos", "ia-input-mac/macos"]
# apple-owned: end

[dependencies]
ia-core.workspace = true
ia-platform.workspace = true
ia-session0.workspace = true
ia-input-win.workspace = true
ia-capture-win.workspace = true
ia-frame.workspace = true
ia-capture-x11.workspace = true
ia-input-x11.workspace = true
ia-ui.workspace = true
# The §7.2 / D §4.2 blobs are serde types, and the hand-over errors are `thiserror` ones.
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
rand.workspace = true
uuid.workspace = true
subtle.workspace = true
zeroize.workspace = true
# §7.3 image hash over the held handle (hopipe).
sha2.workspace = true
hex.workspace = true

tokio = { workspace = true, optional = true, features = ["process", "io-std", "signal"] }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }
shiguredo_libvpx = { workspace = true, optional = true }
audiopus = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }

# Phase E §7.8: the Linux `sh` runner (setsid, killpg, the fd-3 pipe) and the root refusal.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# Phase F §17.7: owned by the apple stream (the macOS capture and input crates, and later the
# objc2 family, §10).
[target.'cfg(target_os = "macos")'.dependencies]
ia-capture-mac.workspace = true
ia-input-mac.workspace = true
# The macOS `zsh` / `sh` runner (setsid, killpg, the fd-3 body) and `process_is_elevated`.
libc.workspace = true

# The Win32 calls the binary makes itself (§8.4 playbook job object, owner-only run file,
# token queries; §6.1 rename-without-replace). Pure bindings; no extra DLL is imported.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    # `ShellExecuteExW` / `SHELLEXECUTEINFOW` (the §7.3 `runas` launch) sit behind the `windows`
    # crate's `Win32_System_Registry` gate. Phase C compiled only because another crate in the
    # graph happened to enable it; naming it here keeps `ia-agent` building on its own, which is
    # how `ia-service` depends on it (`default-features = false`).
    "Win32_System_Registry",
] }

[dev-dependencies]
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
# For the media loopback test (two real webrtc-rs peers); only used behind cfg(media).
webrtc.workspace = true
bytes.workspace = true
