[package]
name = "ia-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The IndiansAssist Windows agent binary: token-source precedence, elevation hand-over flow, self-delete decision (pure, tested), and the webrtc-rs peer / encoders / signaling wiring behind the `media` feature (contract §11.1)."

[[bin]]
name = "IndiansAssist"
path = "src/main.rs"

[lib]
name = "ia_agent"
path = "src/lib.rs"

[features]
# Default on the MSVC host is the full runnable agent. The library crates still build
# pure-Rust with `--no-default-features` on the gnu toolchain for the ia-core cross-check.
default = ["media", "winapi", "gui"]
# `dev` compiles the local-testing switches (`--api-origin`, `--signal-url`,
# `--auto-consent`, `IA_CODEC_PREF`); a release build omits them (§2.1, §4.2).
dev = ["ia-ui/dev"]
# The webrtc-rs peer, VP8/VP9 (libvpx) + Opus encoders, rustls signaling client.
media = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:webrtc",
    "dep:bytes",
    "dep:async-trait",
    "dep:shiguredo_libvpx",
    "dep:audiopus",
    "dep:cpal",
]
# The Win32 syscall layer (DXGI/GDI capture, SendInput, registry, known folders).
winapi = [
    "ia-input-win/winapi",
    "ia-capture-win/winapi",
    "ia-platform/winapi",
]
# The egui/eframe consent window, pill, panel and tray icon.
gui = ["ia-ui/gui"]

[dependencies]
ia-core.workspace = true
ia-platform.workspace = true
ia-input-win.workspace = true
ia-capture-win.workspace = true
ia-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
rand.workspace = true
uuid.workspace = true

tokio = { workspace = true, optional = true, features = ["process", "io-std", "signal"] }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }
shiguredo_libvpx = { workspace = true, optional = true }
audiopus = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }

# The Win32 calls the binary makes itself (§8.4 playbook job object, owner-only run file,
# token queries; §6.1 rename-without-replace). Pure bindings; no extra DLL is imported.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
# For the media loopback test (two real webrtc-rs peers); only used behind cfg(media).
webrtc.workspace = true
bytes.workspace = true
