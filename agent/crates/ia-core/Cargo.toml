[package]
name = "ia-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "IndiansAssist agent core: protocol types, ia.sec handshake + frame crypto, session state machine, ABR, token/sidecar/filename parsing, file sanitisation, playbook arg validation. Pure Rust; no platform or webrtc calls (contract §11.1)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
subtle.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
rand_core.workspace = true
regex.workspace = true
url.workspace = true
thiserror.workspace = true
# NFC for the A F5 `sanitiseFileName` port; already in the tree through url -> idna (Unicode-3.0).
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
serde_json.workspace = true
