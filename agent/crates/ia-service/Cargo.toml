[package]
name = "ia-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The installed service of contract D 11.1 (Windows SCM) and F section 8 (Linux systemd): the device
# identity and its sealing, the enrollment client, the persistent /signal/device socket, interactive
# reporting, the action policy gate, worker supervision and the section 4.2 handoff, the offline-queue
# drain, waker and AMT execution, receipts and the watchdog registration. The one-line description
# below is also the Debian package synopsis (cargo-deb reads it), so it stays under 80 characters.
description = "IndiansAssist agent service for unattended remote support"

[lib]
name = "ia_service"
path = "src/lib.rs"

# One binary name on both platforms: `service` builds the Windows SCM service, `linux-service` the
# systemd one (F §8.2). Built with neither, `main` says so and exits.
[[bin]]
name = "ia-service"
path = "src/main.rs"

[features]
# Default: the pure half (paths, config, the manifest and integrity comparison, the machine
# facts, the device-socket protocol handling) so `cargo test` runs it anywhere.
default = []
# The real service: Win32, the SCM, the network, the worker launch.
service = [
    "dep:windows",
    "dep:windows-service",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:ureq",
    "ia-session0/winapi",
    "ia-platform/winapi",
    "ia-waker/net",
]
# Phase F §8.2: the Linux systemd service (logind and systemd over the system bus through zbus,
# the socketpair worker launch, sd_notify). Compiles to nothing off Linux, so the Windows
# `--all-features` gates are unchanged.
linux-service = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:ureq",
    "ia-platform/linux-os",
    "ia-waker/net",
    "dep:zbus",
]
# Local-testing switches (`--data-dir`, `--console`, `--api-origin`), as C does with `dev`.
dev = []
# Phase F §17.3 / §17.7 (stream apple): the macOS LaunchDaemon half (the device socket, the
# worker socket, the System-keychain sealer). The linux-service set without zbus and linux-os.
# Compiles to nothing off macOS.
macos-service = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:ureq",
    "ia-waker/net",
]

[dependencies]
ia-core.workspace = true
ia-platform.workspace = true
ia-session0.workspace = true
ia-vault.workspace = true
ia-waker.workspace = true
ia-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
uuid.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The service is the one that reads the wall clock (tamper event timestamps, the rule 9.9 gate
# at dispatch), so it enables chrono's `clock` feature; `ia-core` deliberately does not.
chrono = { workspace = true, features = ["clock"] }

tokio = { workspace = true, optional = true, features = ["process", "signal"] }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
ureq = { version = "2.10.1", default-features = false, features = ["tls", "gzip"], optional = true }
windows-service = { version = "0.7.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
] }

# Phase F §8.2 / §10: zbus at the version already locked through ksni (5.19.0), Linux only, with
# the tokio backend ksni already uses (so nothing new enters Cargo.lock); libc for the key-file
# modes, getuid and gethostname.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", optional = true, default-features = false, features = ["tokio"] }
libc.workspace = true

# Phase F §17.7: owned by the apple stream (macOS-target dependencies of `macos-service`).
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.13.0"

# Phase F §8.12: the fake `org.freedesktop.login1` that `agent/scripts/logind-fake.sh` serves on a
# private dbus-daemon (never the real system bus). Linux only; a stub `main` elsewhere.
[[example]]
name = "logind_fake"
required-features = ["linux-service"]

# Phase F §8.9: the Linux packages. `pnpm linux:pkg` (packaging/linux/build.mjs) builds the two
# release binaries with the E §7.9 zigbuild (glibc 2.34 floor, F §8.9 revision 3), stages them with the installed-file
# manifest the §8.8 integrity check reads in packaging/linux/out/stage/, and then runs cargo-deb
# 3.8.0 and cargo-generate-rpm 0.21.1 with `--no-build` over that stage (cargo-deb also with
# `--no-strip`, so the shipped bytes are the bytes the manifest hashes). Paths are relative to this
# crate. The package name is the unit's and the Ansible role's: `indiansassist-agent`.
[package.metadata.deb]
name = "indiansassist-agent"
revision = ""
maintainer = "IndiansAssist <packaging@example.test>"
copyright = "IndiansAssist"
section = "admin"
priority = "optional"
extended-description = """\
The IndiansAssist agent service for Linux: a systemd system service that holds the device \
identity and attaches to the signed-in user's X11 session for unattended remote support. \
Third-party licences are listed in docs/LICENSE-REGISTER.md of the source distribution."""
depends = "libc6 (>= 2.34)"
recommends = "systemd"
maintainer-scripts = "../../../packaging/linux/debian/"
assets = [
    ["../../../packaging/linux/out/stage/ia-service", "usr/lib/indiansassist/ia-service", "755"],
    ["../../../packaging/linux/out/stage/ia-desktop", "usr/lib/indiansassist/ia-desktop", "755"],
    ["../../../packaging/linux/out/stage/manifest.json", "usr/lib/indiansassist/manifest.json", "644"],
    ["../../../packaging/linux/indiansassist-agent.service", "usr/lib/systemd/system/indiansassist-agent.service", "644"],
    ["../../../packaging/linux/copyright", "usr/share/doc/indiansassist-agent/copyright", "644"],
]

[package.metadata.generate-rpm]
name = "indiansassist-agent"
release = "1"
summary = "IndiansAssist agent service for Linux (X11 unattended)"
description = "The IndiansAssist agent service for Linux: a systemd system service that holds the device identity and attaches to the signed-in user's X11 session for unattended remote support. Third-party licences are listed in docs/LICENSE-REGISTER.md of the source distribution."
vendor = "IndiansAssist"
# Exactly the Requires below (no ldd discovery); `/bin/sh` stays because the scriptlets need it.
auto-req = "no"
post_install_script = "../../../packaging/linux/rpm/post.sh"
post_install_script_prog = ["/bin/sh"]
pre_uninstall_script = "../../../packaging/linux/rpm/preun.sh"
pre_uninstall_script_prog = ["/bin/sh"]
post_uninstall_script = "../../../packaging/linux/rpm/postun.sh"
post_uninstall_script_prog = ["/bin/sh"]
assets = [
    { source = "../../../packaging/linux/out/stage/ia-service", dest = "/usr/lib/indiansassist/ia-service", mode = "755", user = "root", group = "root" },
    { source = "../../../packaging/linux/out/stage/ia-desktop", dest = "/usr/lib/indiansassist/ia-desktop", mode = "755", user = "root", group = "root" },
    { source = "../../../packaging/linux/out/stage/manifest.json", dest = "/usr/lib/indiansassist/manifest.json", mode = "644", user = "root", group = "root" },
    { source = "../../../packaging/linux/indiansassist-agent.service", dest = "/usr/lib/systemd/system/indiansassist-agent.service", mode = "644", user = "root", group = "root" },
    { source = "../../../packaging/linux/copyright", dest = "/usr/share/doc/indiansassist-agent/copyright", mode = "644", user = "root", group = "root", doc = true },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.34"

[package.metadata.generate-rpm.recommends]
systemd = "*"
