[package]
name = "ia-input-x11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Linux X11 input and clipboard (Phase E contract §7.2): the W3C code -> evdev table, the normalised-to-root pointer mapping and the rule 7.3c injection-guard decision (pure, tested on every host), and XTEST injection, Unicode text through a spare keycode, and the arboard clipboard behind the `x11` feature on Linux."

[features]
default = []
# XTEST injection and the X11 clipboard. Compiles to nothing off Linux.
x11 = ["dep:x11rb", "dep:arboard"]

[dependencies]
ia-core.workspace = true
ia-platform.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# xtest: FakeInput. xfixes: SelectSelectionInput, so the clipboard is read only after its owner
# changed instead of on every poll (arboard opens a new X connection per foreign read).
x11rb = { workspace = true, optional = true, features = ["xtest", "xfixes"] }
arboard = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { workspace = true, features = ["xtest"] }

[dev-dependencies]
serde_json.workspace = true
