[package]
name = "ia-capture-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase F section 17.2 (stream apple): macOS ScreenCaptureKit capture. An F0 stub: compiles to nothing until the apple stream fills it, and to nothing off macOS."

[features]
default = []
# Enabled by `ia-agent/macos`; the apple stream names what it turns on.
macos = []

[dependencies]

# Phase F §17.7: owned by the apple stream (the objc2 family, §10, macOS-target only).
[target.'cfg(target_os = "macos")'.dependencies]
