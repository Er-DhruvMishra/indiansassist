[package]
name = "ia-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent UI: the consent window, floating pill + panel, tray, prompts and the §3.5 physical-input self-defence (view-model pure and tested; egui/eframe/tray-icon rendering and the Win32 window treatment behind the `gui` feature)."

[features]
default = []
# egui/eframe (glow renderer) + tray-icon + the Win32 window treatment and input hooks.
gui = ["dep:egui", "dep:eframe", "dep:tray-icon", "dep:winit", "dep:windows"]
# Dev builds only: honour IA_DEV_SHOW_INDICATOR_IN_CAPTURE=1 (skip WDA_EXCLUDEFROMCAPTURE so a
# manual verification run can screenshot the pill and panel). Never in a release build.
dev = []

[dependencies]
ia-core.workspace = true
tracing.workspace = true
egui = { version = "0.29.1", optional = true }
# glow only (no wgpu: smaller exe); default_fonts so text renders.
eframe = { version = "0.29.1", optional = true, default-features = false, features = ["glow", "default_fonts"] }
tray-icon = { version = "0.19.2", optional = true }
# Same winit eframe uses; only for `EventLoopBuilderExtWindows::with_any_thread`.
winit = { version = "0.30", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
