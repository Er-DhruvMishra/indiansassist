[package]
name = "ia-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent UI view-model: consent window, floating pill + panel, tray, prompts, receipt, and the §3.5 physical-input self-defence gate (pure, tested). egui/eframe rendering lives behind the `gui` feature."

[features]
default = []
# egui/eframe/tray-icon rendering; built in dev/CI with a display. Pulls a large but
# pure-Rust GUI stack, so it is off by default to keep the core gate fast on gnu.
gui = ["dep:egui", "dep:eframe", "dep:tray-icon"]

[dependencies]
ia-core.workspace = true
egui = { version = "0.29.1", optional = true }
eframe = { version = "0.29.1", optional = true, default-features = false, features = ["glow", "wgpu"] }
tray-icon = { version = "0.19.2", optional = true }
