[package]
name = "ia-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent UI: the consent window, floating pill + panel, tray, prompts and the §3.5 physical-input self-defence (view-model pure and tested; egui/eframe rendering, the tray (tray-icon on Windows, ksni on Linux) and the Win32 / X11 window treatment behind the `gui` feature)."

[features]
default = []
# egui/eframe (glow renderer) + the tray + the window treatment. The tray is `tray-icon` on
# Windows and `ksni` (StatusNotifierItem over D-Bus, no GTK) on Linux (Phase E §7.2); each is a
# target-specific dependency, so `--all-features` on Windows never pulls GTK and the Linux build
# never pulls tray-icon's GTK / libappindicator.
gui = ["dep:egui", "dep:eframe", "dep:tray-icon", "dep:winit", "dep:windows", "dep:ksni", "dep:x11rb"]
# Phase F §9.2: the portal build's UI on Wayland: eframe's Wayland backend (winit with
# `wayland-dlopen`, so libwayland-client is opened at run time and nothing is linked). The window
# backends are Linux-target dependencies, so this enables nothing on Windows or macOS.
wayland = ["gui", "eframe?/wayland", "winit?/wayland", "winit?/wayland-dlopen"]
# Dev builds only: honour IA_DEV_SHOW_INDICATOR_IN_CAPTURE=1 (skip WDA_EXCLUDEFROMCAPTURE so a
# manual verification run can screenshot the pill and panel). Never in a release build.
dev = []

[dependencies]
ia-core.workspace = true
tracing.workspace = true
# No `default_fonts` anywhere (licence audit F2): egui's built-in set includes Ubuntu-Light under
# the Ubuntu Font Licence, which is not OSI-approved. `fonts` embeds Noto Sans and Noto Emoji (SIL
# OFL 1.1) from `assets/fonts/` instead.
egui = { version = "0.29.1", optional = true, default-features = false }
# glow only (no wgpu: smaller exe).
eframe = { version = "0.29.1", optional = true, default-features = false, features = ["glow"] }
# Same winit eframe uses; only for `EventLoopBuilderExtWindows::with_any_thread`.
winit = { version = "0.30", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
# Phase F §6.1 / §10: the camera-link QR in the chat panel (`camqr`), Windows and Linux; the macOS
# QR is the apple stream's. Pure Rust, no default features (no image or svg renderer).
qrcode = { version = "=0.14.1", default-features = false }
tray-icon = { version = "0.19.2", optional = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Phase E §7.2: on Linux eframe / winit use the X11 backend only (libX11, libxkbcommon and libGL
# are opened at run time, not linked), and the tray is ksni (pure-Rust D-Bus through zbus).
[target.'cfg(target_os = "linux")'.dependencies]
qrcode = { version = "=0.14.1", default-features = false }
eframe ={ version = "0.29.1", optional = true, default-features = false, features = ["glow", "x11"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["x11", "rwh_06"] }
# The pill treatment over EWMH (utility type, above, skip-taskbar), pure-Rust X11.
x11rb = { workspace = true, optional = true }
ksni = { version = "0.3.7", optional = true, default-features = false, features = ["blocking", "tokio"] }
# `uifail::preflight`: dlopen the libraries winit would otherwise panic without.
libc.workspace = true

# Phase F §17.7: owned by the apple stream (eframe's AppKit backend, `tray-icon` on macOS, §17.2).
[target.'cfg(target_os = "macos")'.dependencies]
# The consent window's two TCC steps call the system requests and checks (§17.2).
ia-capture-mac = { workspace = true, features = ["macos"] }
ia-input-mac = { workspace = true, features = ["macos"] }
