[package]
name = "ia-capture-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows screen capture: recorder fixed-canvas letterbox / ladder scaling math (pure, §3.6 M6, §4.1) plus DXGI/GDI capture, monitor enumeration and BGRA->I420 conversion (behind `winapi`)."

[features]
default = []
# The production capture path adopts yuvutils-rs (BGRA->I420) and fast_image_resize
# (ladder downscale); until the DXGI path is wired in CI the GDI path here uses a
# self-contained BT.601 converter so the `winapi` build needs no extra C/SIMD crates.
winapi = ["dep:windows"]

[dependencies]
ia-core.workspace = true
ia-platform.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
