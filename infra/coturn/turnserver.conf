# IndiansAssist coturn configuration (contracts section 11.5, binding).
#
# This file is a TEMPLATE: infra/coturn/entrypoint.sh substitutes ${TURN_SECRET}, ${TURN_REALM},
# ${TURN_EXTERNAL_IP}, ${TURN_MIN_PORT} and ${TURN_MAX_PORT} at container start and writes the result to
# /tmp/turnserver.conf. Never put the real secret in this file.
#
# The API signs TURN REST credentials with the SAME secret (api env TURN_SECRET):
#   username   = "<unix expiry>:<principal>"
#   credential = base64(HMAC-SHA1(TURN_SECRET, username))
# Rotating TURN_SECRET invalidates outstanding credentials: rotate in a maintenance window or run two coturn
# instances during the overlap (infra/README.md, "Secrets rotation").

# --- listeners (section 6.11 URLs) ---------------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# --- TURN REST API credentials ----------------------------------------------------------------------------
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}
fingerprint

# --- TLS for turns:5349 (same certificate as nginx, mounted from infra/certs) -----------------------------
# The entrypoint removes these two lines and adds `no-tls` when the files are not mounted (TLS is optional).
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# --- attack surface ---------------------------------------------------------------------------------------
no-cli
no-multicast-peers
no-loopback-peers
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
no-software-attribute
secure-stun

# --- relay port range (dev 49160-49200 published by Compose; production 49152-65535 with host networking) -
min-port=${TURN_MIN_PORT}
max-port=${TURN_MAX_PORT}

# --- NAT: public IP of the host, or "public/private" -------------------------------------------------------
external-ip=${TURN_EXTERNAL_IP}

# --- no relay into the Compose network or any private / special range (TURN SSRF guard) --------------------
# Add `allowed-peer-ip` only for a documented, specific need.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff

# --- quotas -----------------------------------------------------------------------------------------------
total-quota=1200
user-quota=12
max-bps=0
bps-capacity=0
stale-nonce=600

# --- logging: to the container's stdout, terse ------------------------------------------------------------
log-file=stdout
simple-log

# --- process --------------------------------------------------------------------------------------------
pidfile=/var/tmp/turnserver.pid
# Contract 11.5 lists proc-user=turnserver / proc-group=turnserver. The official coturn/coturn image already
# starts the daemon unprivileged (user nobody:nogroup) and has no `turnserver` account, so a setuid would fail.
# Privileges are therefore dropped by the image, not by coturn. Uncomment only on a host install started as root.
#proc-user=turnserver
#proc-group=turnserver
