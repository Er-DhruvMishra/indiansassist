# IndiansAssist nginx main configuration (contracts section 11.4, binding).
# Server blocks live in web.conf (installed as /etc/nginx/conf.d/web.conf); shared snippets
# (security-headers.conf, proxy-common.conf) are installed under /etc/nginx/ia/.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # P4: never log the query string ($uri, never $request / $args). The bearer token travels in the URL
  # fragment, which browsers do not send, so it can never reach this log.
  log_format ia '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout ia;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  # P5: 1m everywhere unless a location raises it (recording uploads).
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # WebSocket upgrade for /signal.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # P1: TLS 1.3 preferred, 1.2 kept only for older Desk browsers (hardening toggle: drop TLSv1.2).
  # Mozilla "intermediate" profile.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_session_timeout 1d;
  ssl_session_cache shared:IA_TLS:10m;
  ssl_session_tickets off;

  # Per-IP flood ceilings in front of the api. The api enforces the contract limits of section 6.12 itself;
  # these only absorb floods before they reach Node.
  limit_req_zone $binary_remote_addr zone=ia_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=ia_auth:10m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=ia_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  include /etc/nginx/conf.d/*.conf;
}
