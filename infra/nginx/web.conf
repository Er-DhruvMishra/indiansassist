# IndiansAssist web server blocks (contracts section 11.4 P1-P5).
# - TLS termination for WEB_ORIGIN (certificates in infra/certs, mounted at /etc/nginx/certs).
# - /api/, /signal (WebSocket upgrade) and /.well-known/indiansassist.json are proxied to api:4000, so
#   WEB_ORIGIN === API_ORIGIN and the api port is never published.
# - Everything else serves the SPA built into /usr/share/nginx/html (try_files $uri /index.html).
# - /metrics is never proxied (it lives on the api's METRICS_PORT listener, internal only).

upstream ia_api {
  server api:4000;
  keepalive 32;
}

# Port 80: ACME http-01 challenges; everything else redirects to https.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/ia/security-headers.conf;
  limit_conn ia_conn 200;

  # --- REST API (HTTP/1.1 keepalive to the upstream) ------------------------------------------------------
  location /api/ {
    include /etc/nginx/ia/proxy-common.conf;
    proxy_set_header Connection "";
    limit_req zone=ia_api burst=100 nodelay;
    proxy_pass http://ia_api;
  }

  # Auth endpoints get a tighter flood ceiling (the contract limit of 10/min/IP is enforced by the api).
  location ~ ^/api/v1/auth/(login|signup|accept-invite|password)$ {
    include /etc/nginx/ia/proxy-common.conf;
    proxy_set_header Connection "";
    limit_req zone=ia_auth burst=20 nodelay;
    proxy_pass http://ia_api;
  }

  # P5: single-shot recording upload (100 MiB plus multipart overhead).
  location ~ ^/api/v1/sessions/[^/]+/recordings$ {
    include /etc/nginx/ia/proxy-common.conf;
    proxy_set_header Connection "";
    client_max_body_size 110m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://ia_api;
  }

  # P5: chunked recording upload parts (16 MiB each).
  location ~ ^/api/v1/recordings/uploads/[^/]+/parts/[0-9]+$ {
    include /etc/nginx/ia/proxy-common.conf;
    proxy_set_header Connection "";
    client_max_body_size 17m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://ia_api;
  }

  # --- WebSocket signaling (P2) -----------------------------------------------------------------------------
  # Both timeouts are longer than the 60 s heartbeat idle timeout of section 7.2.
  location = /signal {
    include /etc/nginx/ia/proxy-common.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_pass http://ia_api;
  }

  # --- public key discovery ---------------------------------------------------------------------------------
  location = /.well-known/indiansassist.json {
    include /etc/nginx/ia/proxy-common.conf;
    proxy_set_header Connection "";
    proxy_pass http://ia_api;
  }

  # --- SPA --------------------------------------------------------------------------------------------------
  # Hashed Vite assets are immutable; `expires` sets Cache-Control without add_header, so P3 headers survive.
  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
  }

  # Phase B 10.2: the console's replayer frame. P3 headers minus X-Frame-Options, embeddable only by this host
  # (the SPA CSP says frame-ancestors 'none'); its own hash-only meta CSP is inside the file. add_header here
  # replaces the inherited set, so every header is listed again.
  location = /replayer.html {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), display-capture=(self), microphone=(self)" always;
    add_header Content-Security-Policy "frame-ancestors https://$host" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
