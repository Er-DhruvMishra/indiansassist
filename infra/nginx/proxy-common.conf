# Shared proxy settings for every location that forwards to the api.
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite (never append) X-Forwarded-For: the api runs with TRUST_PROXY=true and keys every per-IP limit on
# this value, so a client-supplied header must not survive. If another proxy (Caddy, a cloud LB) sits in
# front of this nginx, configure the realip module (infra/README.md, "TLS termination").
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
