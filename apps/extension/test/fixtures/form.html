<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IA Fixture Form</title>
    <style>
      body { font-family: sans-serif; margin: 24px; }
      label { display: block; margin: 8px 0; }
      #list { height: 180px; overflow: auto; border: 1px solid #999; margin: 8px 0; padding: 0 16px; }
    </style>
  </head>
  <body>
    <h1>IA fixture: payroll settings</h1>
    <p id="visible">Fixture visible text for the mirror</p>
    <form onsubmit="return false">
      <label>Employee name <input id="name" type="text" value="" autocomplete="off" /></label>
      <label>Password <input id="pw" type="password" value="hunter2-secret" autocomplete="off" /></label>
      <label>City <input id="city" type="text" value="" autocomplete="off" /></label>
      <label>Department <input id="dept" type="text" value="" autocomplete="off" /></label>
      <label>Notes <textarea id="notes" rows="2" cols="40"></textarea></label>
    </form>
    <p>Account number: <span id="sensitive" data-ia-sensitive>SENSITIVE-4111-2222</span></p>
    <div data-ia-block id="blocked">BLOCKED-PANEL-CONTENT</div>
    <button id="toggle" type="button" onclick="this.textContent = this.textContent === 'On' ? 'Off' : 'On'">Off</button>
    <!-- Bandwidth scenario (contract 13.4): ten toggle buttons and a long scrolling list. -->
    <div id="flips"></div>
    <ul id="list"></ul>
    <script>
      for (let i = 0; i < 10; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.id = 'flip-' + i;
        b.textContent = 'Flip ' + i + ': off';
        b.onclick = () => (b.textContent = b.textContent.endsWith('off') ? 'Flip ' + i + ': on' : 'Flip ' + i + ': off');
        document.getElementById('flips').appendChild(b);
      }
      const list = document.getElementById('list');
      for (let i = 1; i <= 200; i++) {
        const li = document.createElement('li');
        li.textContent = 'Payroll row ' + i + ': employee ' + (1000 + i) + ', department ' + (i % 7);
        list.appendChild(li);
      }
    </script>
  </body>
</html>
