<!doctype html>
<!--
  Development entry of the sandboxed replayer frame (Phase B 10.2). The production file dist/replayer.html is
  generated by vite.replayer.config.ts as one self-contained document (inline script and style, hash CSP).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Mirrored tab</title>
    <style>
      html,body{margin:0;height:100%;overflow:hidden;background:#f8fafc}
      #stage{position:absolute;inset:0;overflow:hidden}
      .tab-host{position:absolute;inset:0}
      .replayer-wrapper{position:relative}
      .replayer-wrapper iframe{border:0;background:#fff}
      #overlay{position:absolute;inset:0;z-index:10;outline:none;cursor:not-allowed}
      #overlay:focus-visible{box-shadow:inset 0 0 0 3px #0f766e}
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="overlay" tabindex="0" aria-label="Mirrored tab input surface"></div>
    <script type="module" src="/src/replayer/main.ts"></script>
  </body>
</html>
